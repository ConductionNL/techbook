# Exporteerbare hooks — consumeer in een deelnemende repo via:
#
#   repos:
#     - repo: https://github.com/ConductionNL/techbook
#       rev: <tag-of-sha>
#       hooks:
#         - id: docs-contract
#
# en activeer met: pre-commit install --hook-type pre-push
- id: docs-contract
  name: docs-contract (front-matter, index.md, CODEOWNERS)
  description: >-
    Gate op het docs-contract (docs/conventies.md): elke pagina onder /docs
    heeft geldige front-matter (last_reviewed, owner), er is een index.md en
    een CODEOWNERS-regel. Mechanische check; inhoudelijke juistheid blijft
    mensenwerk (docs-as-code: docs wijzigen mee in dezelfde PR).
  entry: scripts/check_docs_contract.py
  args: ['.']
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-push]

- id: docs-claims
  name: docs-claims (uitvoerbare documentatie)
  description: >-
    Draait verify-gemarkeerde codeblokken (```bash verify) uit docs/ als
    dry-run met timeout en zonder cluster-credentials; rapporteert
    dekking per pagina. Zie handbook org/conventies.md.
  entry: scripts/check_docs_claims.py
  args: ['docs']
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-push]

- id: docs-touched
  name: docs-touched (docs wijzigen mee met de code)
  description: >-
    Diff-gate op docs-as-code (docs/conventies.md §7): faalt wanneer de te
    pushen commits docs-plichtige paden raken zonder dat er documentatie
    meewijzigt. De padregels, de mode (warn/enforce) en alle drempels staan
    in .docs-touched.yaml in de repo-root — niet in args, omdat
    rollout_precommit_hook.sh .pre-commit-config.yaml in zijn geheel
    herschrijft. Vrijstelling is per commit via de trailer
    'Docs-not-needed: <reden>'. Zonder diff-context (geen refs, zoals bij
    --all-files of een root-commit) en zonder .docs-touched.yaml slaat de
    hook zichzelf zichtbaar over met exit 0; er wordt nooit naar een
    baseline geraden.
  entry: scripts/check_docs_touched.py
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-push]
