# Exporteerbare hooks — consumeer in een deelnemende repo via:
#
#   repos:
#     - repo: https://github.com/ConductionNL/techbook
#       rev: <tag-of-sha>
#       hooks:
#         - id: docs-contract
#
# en activeer met: pre-commit install --hook-type pre-push
- id: docs-contract
  name: docs-contract (front-matter, index.md, CODEOWNERS)
  description: >-
    Gate op het docs-contract (docs/conventies.md): elke pagina onder /docs
    heeft geldige front-matter (last_reviewed, owner), er is een index.md en
    een CODEOWNERS-regel. Mechanische check; inhoudelijke juistheid blijft
    mensenwerk (docs-as-code: docs wijzigen mee in dezelfde PR).
  entry: scripts/check_docs_contract.py
  args: ['.']
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-push]

- id: docs-claims
  name: docs-claims (uitvoerbare documentatie)
  description: >-
    Draait verify-gemarkeerde codeblokken (```bash verify) uit docs/ als
    dry-run met timeout en zonder cluster-credentials; rapporteert
    dekking per pagina. Zie handbook org/conventies.md.
  entry: scripts/check_docs_claims.py
  args: ['docs']
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-push]
